# environment
# task: nav_test
# task: tdmpc2_navigation
# task: tdmpc2_navigation_devel
task: tdmpc2_navigation_training
debug_level: "INFO" # DEBUG, INFO, WARNING, ERROR
obs: state
# episode_length_s: 200 # [s]
# episode_length_s: 60 # [s]
episode_length_s: 40 # [s]
episode_length: ?? # Typical episode length for BipedalWalker-v3: 1600
seed_steps: 10 # default: 5000
episodic: true
train_render: false
# env_parameter_file: "env_parameter.yaml"
# env_parameter_file: "env_cross_custom_parameter.yaml"
# env_parameter_file: "env_cross_custom_2_parameter.yaml"
env_parameter_file: "env_cross_v4_parameter.yaml"
# env_parameter_file: "env_follow_parameter.yaml"
# env_id: "NavigationEnv-custom"
# env_id: "NavigationEnv-v2"
# env_id: "NavigationEnv-v3"
# env_id: "NavigationEnv-v3_2"
env_id: "NavigationEnv-v4"

# evaluation
num_envs: ??
num_pedestrians: ??
eval_all_envs: true
eval_video_num: all # all or 0,1,2,...
eval_episodes: 1 # default: 10
# eval_freq: 10000
eval_freq: 5000

# training
# steps: 50000000 # tdmpcのとき 5,000,000
# steps: 100000 # tdmpcのとき 5,000,000
steps: 250000 # tdmpcのとき 5,000,000
# steps: 50000 # このくらいで収束してる?
# steps: 500000 # tdmpcのとき 5,000,000
batch_size: 256
reward_coef: 0.1
value_coef: 0.1
termination_coef: 1
consistency_coef: 20
rho: 0.9 #0.7
lr: 3e-4
enc_lr_scale: 0.3
grad_clip_norm: 20
tau: 0.01
discount_denom: 5
discount_min: 0.95
discount_max: 0.995
buffer_size: 1_000_000

# planning
mpc: true
iterations: 6
num_samples: 512
num_elites: 64
num_pi_trajs: 24
# horizon: 12
horizon: 8
# horizon: 6 #5 # 10
# horizon: 20
# horizon: 3
dt: 0.5 # [s]
min_std: 0.05
max_std: 2
temperature: 0.5

# actor
log_std_min: -10
log_std_max: 2
entropy_coef: 1e-4

# critic
num_bins: 101
vmin: -10
vmax: +10

# architecture
num_enc_layers: 2 #2 4 1
enc_dim: 256
num_channels: 32
mlp_dim: 512
# latent
latent_separate: true
latent_dim: 512 # if latent_separate is true then this is the sum of latent_r_dim and latent_h_dim
latent_r_dim: 256 # 64 # 256
latent_h_dim: 256 # 448 #256
r_obs_shape: ??
h_obs_shape: ??
h_obs_vel_dim: ??

task_dim: 96
num_q: 5
dropout: 0.01
simnorm_dim: 8

# logging
# exp_name: rvo-250k-hdyn_train
# exp_name: 250k-hdyn-train
# exp_name: 250k-hdyn-test-train
# exp_name: env_v3-hdyn-train
# exp_name: hdyn-no_latent-train
# exp_name: env_v3_2-hdyn-train
exp_name: env_v4-hdyn-train
wandb_project: "tdmpc2_navigation_training"
wandb_entity: "eieioeiji0501-toyohashi-university-of-technology"
wandb_silent: false
enable_wandb: true
save_csv: true

# misc
compile: false # compile may not ensure the reproducibility of the results
save_video: true
save_agent: true
seed: 2 #1

# variable placeholders updated in the script
work_dir: tdmpc2_navigation
bin_size: ???
action_dim: ???
model_path: ???
